name: Build VOLT APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Generate Gradle 8.9 wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O gradle.zip
          unzip -q gradle.zip
          ./gradle-8.9/bin/gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew
          rm -rf gradle-8.9 gradle.zip

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VOLT-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
